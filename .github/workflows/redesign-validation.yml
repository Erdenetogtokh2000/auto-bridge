name: Redesign Validation

on:
  push:
    branches:
      - premium-global-sourcing-redesign
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Production build
        run: npm run build
      - name: Redesign safety tests
        run: node --test tests/redesign-safety.test.mjs
